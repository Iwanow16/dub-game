name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm -F @dubroom/help check

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck scripts/*.sh scripts/lib/*.sh
        env:
          LANG: C.UTF-8

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: caddy
          push: false
          cache-from: type=gha
      - name: Validate compose and Caddyfile
        run: |
          printf 'TOKEN_SIGNING_KEY=x\nSTUDIO_KEY=y\n' > /tmp/ci.env
          docker compose --project-directory . -f infra/docker-compose.yml --env-file /tmp/ci.env config -q
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

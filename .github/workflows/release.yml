name: Release images

# Tags v* (created on main by the release process in CONTRIBUTING.md) publish signed images to
# GHCR (§22.5): pinned by digest in production, verified with cosign.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [app, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dubroom-${{ matrix.target }}
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/dubroom-${{ matrix.target }}@${{ steps.build.outputs.digest }}
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/dubroom-${{ matrix.target }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
